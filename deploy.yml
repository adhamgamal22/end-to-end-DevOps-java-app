apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app1-deployment
  labels:
    app: my-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app1-java1
        image: adhamgamal74/my-app-java:V1.0  
        ports:
        - containerPort: 8081

